              - { label: "Title", name: "title", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
              - { label: "Primary Button Text", name: "ctaPrimary", widget: "string" }
              - { label: "Secondary Button Text", name: "ctaSecondary", widget: "string" }
          - label: "Vision Section"
            name: "vision"
            widget: "object"
            fields:
