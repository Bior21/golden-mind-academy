          - label: "Team"
            name: "team"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Founder Name", name: "founderName", widget: "string" }
              - { label: "Founder Role", name: "founderRole", widget: "string" }
              - { label: "Founder Bio", name: "founderBio", widget: "text" }
